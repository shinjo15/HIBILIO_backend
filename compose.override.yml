services:
  app:
    build:
      context: .
      target: development
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8001}:8000"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/var/www/html
    environment:
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=no-reply@hibilio.local
      - MAIL_FROM_NAME=${APP_NAME}
    command: php artisan serve --host=0.0.0.0 --port=8000
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_BIND_ADDRESS:-0.0.0.0}:${MAILPIT_PORT:-8026}:8025"
